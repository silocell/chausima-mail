<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chausima Mail</title>
<meta name="description" content="Chausima Mail: email for chausima.com.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23c8312b' stroke-width='5'/%3E%3Cpath d='M18 26h28v16H18z' fill='none' stroke='%23c8312b' stroke-width='4'/%3E%3Cpath d='M18 26l14 10 14-10' fill='none' stroke='%23c8312b' stroke-width='4'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#c8312b">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chausima Mail">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#17202a; --soft:#5b6673; --line:#dde2e7; --hover:#eceff3;
  --red:#c8312b; --red-ink:#ffffff; --red-wash:#fbeceb; --sel:#e6ebf1; --ok:#1f7a4d;
  --shadow:0 1px 2px rgba(23,32,42,.06),0 8px 24px rgba(23,32,42,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1317; --card:#161b21; --ink:#e7ebee; --soft:#9aa5b1; --line:#2a323b; --hover:#1d242c;
  --red:#ff6a5c; --red-ink:#1a0d0b; --red-wash:#2c1816; --sel:#212a33; --ok:#5fd39a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f1317; --card:#161b21; --ink:#e7ebee; --soft:#9aa5b1; --line:#2a323b; --hover:#1d242c;
  --red:#ff6a5c; --red-ink:#1a0d0b; --red-wash:#2c1816; --sel:#212a33; --ok:#5fd39a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ---------- sign in ---------- */
#signin{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.door{width:100%;max-width:400px;text-align:center}
.postmark{width:208px;height:208px;margin:0 auto 8px;display:block;color:var(--red)}
.postmark .wave{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)}
.door h1{font-size:28px;line-height:1.2;margin:8px 0 4px}
.door p.lead{color:var(--soft);margin:0 0 24px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.field input:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-wash)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.main{background:var(--red);color:var(--red-ink)}
.btn.main:hover{filter:brightness(1.06)}
.btn.plain{background:transparent;border:1.5px solid var(--line)}
.btn.plain:hover{background:var(--hover)}
.btn:disabled{opacity:.6;cursor:default}
.door .btn.main{width:100%;padding:13px}
.err{color:var(--red);font-weight:700;min-height:24px;margin:10px 0 0}
.fine{color:var(--soft);font-size:14px;margin-top:22px}
.check{display:flex;gap:8px;align-items:center;justify-content:flex-start;font-size:15px;color:var(--soft);margin:2px 0 16px}

/* ---------- app ---------- */
#app{height:100%;display:grid;grid-template-columns:232px minmax(300px,400px) 1fr;grid-template-rows:56px 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.brand svg{width:28px;height:28px;color:var(--red)}
.search{flex:1;max-width:520px;margin-left:16px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1.5px solid transparent;background:var(--paper)}
.search input:focus{border-color:var(--red);outline:none;background:var(--card)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--soft);font-size:14px;white-space:nowrap}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--soft)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

.rail{padding:14px 10px;border-right:1px solid var(--line);overflow:auto;background:var(--card)}
.rail .btn.main{width:100%;margin-bottom:14px}
.folders{list-style:none;margin:0;padding:0}
.folders button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 12px;border-radius:10px;text-align:left}
.folders button:hover{background:var(--hover)}
.folders button[aria-current="true"]{background:var(--red-wash);color:var(--red);font-weight:700}
.folders svg{width:18px;height:18px;flex:none}
.folders .n{margin-left:auto;font-size:13px;font-weight:700}
.quota{margin:18px 12px 0;font-size:13px;color:var(--soft)}
.quota .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.quota .bar i{display:block;height:100%;background:var(--soft)}

.list{border-right:1px solid var(--line);overflow:auto;background:var(--card)}
.listhead{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:1}
.listhead h2{font-size:20px;margin:0}
.msgs{list-style:none;margin:0;padding:0}
.msgs li{border-bottom:1px solid var(--line)}
.msgs button{width:100%;border:0;background:transparent;text-align:left;padding:12px 16px 12px 22px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;position:relative}
.msgs button:hover{background:var(--hover)}
.msgs button[aria-current="true"]{background:var(--sel)}
.msgs .who{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .when{font-size:13px;color:var(--soft);white-space:nowrap}
.msgs .subj{grid-column:1/-1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .pre{grid-column:1/-1;font-size:14px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .unread .who,.msgs .unread .subj{font-weight:700}
.msgs .unread button::before{content:"";position:absolute;left:8px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.empty{padding:40px 24px;text-align:center;color:var(--soft)}
.more{display:block;margin:12px auto 20px}

.read{overflow:auto;background:var(--paper)}
.sheet{max-width:860px;margin:0 auto;padding:24px}
.paperslip{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:24px}
.read h2{font-size:24px;line-height:1.25;margin:0 0 16px;overflow-wrap:anywhere}
.from{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--red-wash);color:var(--red);display:grid;place-items:center;font-weight:700;flex:none}
.from .names{flex:1;min-width:0}
.from .names b{display:block;overflow-wrap:anywhere}
.from .names span{color:var(--soft);font-size:14px;overflow-wrap:anywhere}
.from time{color:var(--soft);font-size:14px;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 18px}
.actions .btn{padding:8px 14px;font-size:15px}
.imgnote{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--soft);margin-bottom:14px}
.imgnote button{border:0;background:transparent;color:var(--red);font-weight:700;padding:4px}
.body{border-top:1px solid var(--line);padding-top:16px}
.body iframe{width:100%;border:0;min-height:200px;background:#fff;border-radius:8px;display:block}
.body pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:0}
.body a{color:var(--red)}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.att{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:14px}
.att:hover{background:var(--hover)}
.att svg{width:16px;height:16px}
.nothing{height:100%;display:grid;place-items:center;color:var(--soft);text-align:center;padding:24px}
.nothing svg{width:120px;height:120px;color:var(--line);display:block;margin:0 auto 10px}
.back{display:none}

/* ---------- write ---------- */
dialog#write{border:0;padding:0;border-radius:16px;width:min(680px,calc(100% - 32px));max-height:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog#write::backdrop{background:rgba(15,19,23,.45)}
.wform{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.whead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line)}
.whead h2{font-size:18px;margin:0}
.wrow{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 20px}
.wrow label{width:64px;color:var(--soft);font-size:15px;flex:none}
.wrow input{flex:1;border:0;background:transparent;padding:12px 0;min-width:0}
.wrow input:focus{outline:none}
.wform textarea{flex:1;min-height:240px;border:0;background:transparent;padding:16px 20px;resize:vertical}
.wform textarea:focus{outline:none}
.wfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.wfoot .err{margin:0;min-height:0;font-size:14px;flex:1}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:var(--shadow);z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--red-wash);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.confirm span{flex:1;min-width:160px}

/* ---------- small screens ---------- */
@media (max-width:1100px){#app{grid-template-columns:200px minmax(280px,340px) 1fr}}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:56px 1fr}
  .rail{display:none}
  #app.railopen .rail{display:block;position:fixed;inset:56px auto 0 0;width:260px;z-index:20;box-shadow:var(--shadow)}
  .list,.read{grid-column:1;grid-row:2}
  #app.reading .list{display:none}
  #app:not(.reading) .read{display:none}
  .back{display:inline-flex}
  .search{margin-left:0}
  .me .addr{display:none}
  .brand span{display:none}
  .sheet{padding:12px}
  .paperslip{padding:16px}
  .from{flex-wrap:wrap}.from time{order:3;width:100%;padding-left:52px;margin-top:-4px}
  #app.reading .fab{display:none}
  .fab{position:fixed;right:16px;bottom:20px;z-index:10;border-radius:999px!important;padding:14px 20px!important;box-shadow:var(--shadow)}
}
@media (min-width:821px){.fab,.menu{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Gmail-style layout ===== */
:root{--paper:#f6f8fc;--pill:#e9eef6;--hover:#eef2f8;--rowline:#eceff3;--compose:#fbe3e1;--compose-ink:#8f1f1a;--star:#e0a100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1317;--pill:#1d242c;--hover:#1b2128;--rowline:#222a32;--compose:#3a1d1b;--compose-ink:#ffb4ab;--star:#ffcc4d}}
:root[data-theme="dark"]{--paper:#0f1317;--pill:#1d242c;--hover:#1b2128;--rowline:#222a32;--compose:#3a1d1b;--compose-ink:#ffb4ab;--star:#ffcc4d}
#app{grid-template-columns:256px minmax(320px,440px) 1fr;grid-template-rows:64px 1fr;background:var(--paper)}
.top{background:var(--paper);border-bottom:0;gap:8px;padding:0 12px 0 8px;position:relative}
.brand{width:236px;padding-left:12px}
.search{flex:1;max-width:720px;margin:0;display:flex;align-items:center;gap:4px;background:var(--pill);border-radius:999px;padding:4px 6px;height:48px}
.search:focus-within{background:var(--card);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0!important;background:transparent!important;padding:8px 6px!important;box-shadow:none!important;outline:none}
.search .glass{position:static;transform:none;width:20px;height:20px;margin:0 6px 0 8px;color:var(--soft);flex:none}
.search .menu{display:none}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;border:0;padding:0;background:#6b7785}
.avatar.big{width:44px;height:44px;font-size:19px}
.me-btn{cursor:pointer;margin-left:auto}
.menu-pop{position:absolute;right:12px;top:58px;z-index:40;background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px;min-width:260px}
.me-who{display:flex;align-items:center;gap:12px;padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-wrap:anywhere}
.pop-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px 8px;border-radius:10px;text-align:left}
.pop-item:hover{background:var(--hover)}
.pop-item svg{width:20px;height:20px;color:var(--soft)}

.rail{background:var(--paper);border-right:0;padding:8px 12px 16px 8px}
.compose{display:inline-flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--compose);color:var(--compose-ink);font-weight:700;padding:16px 24px 16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin:0 0 14px 4px}
.compose:hover{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.compose svg{width:22px;height:22px;flex:none}
.folders button{border-radius:0 999px 999px 0;padding:7px 12px 7px 20px;margin-left:-8px;width:calc(100% + 8px)}
.folders button[aria-current="true"]{background:var(--compose);color:var(--compose-ink)}

.list{background:var(--card);border-right:0;border-radius:16px 0 0 0}
.listhead{background:var(--card);border-bottom:1px solid var(--rowline);padding:10px 12px 8px 20px;border-radius:16px 0 0 0}
.listhead .label{font-size:15px;font-weight:700;color:var(--soft);margin:0}
.msgs li{position:relative;border-bottom:1px solid var(--rowline)}
.msgs .row{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:40px 1fr auto;column-gap:14px;row-gap:0;padding:12px 14px 12px 16px;align-items:start;position:relative}
.msgs .row:hover{background:var(--hover)}
.msgs .row[aria-current="true"]{background:var(--compose)}
.msgs .row .avatar{grid-row:1/4;width:40px;height:40px;font-size:17px;margin-top:2px}
.msgs .who{grid-column:2;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .when{grid-column:3;font-size:13px;color:var(--soft);white-space:nowrap;padding-top:2px}
.msgs .subj{grid-column:2/4;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .pre{grid-column:2/3;font-size:14px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:30px}
.msgs .unread .who,.msgs .unread .subj,.msgs .unread .when{font-weight:700;color:var(--ink)}
.msgs .unread .row::before{content:"";position:absolute;left:auto;right:16px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.msgs .unread .when{padding-right:16px}
.star{position:absolute;right:8px;bottom:6px;width:36px;height:36px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.star:hover{background:var(--hover)}
.star svg{width:21px;height:21px;fill:none}
.star.on{color:var(--star)}
.star.on svg{fill:currentColor}
.read{background:var(--card);border-left:1px solid var(--rowline)}
.paperslip{box-shadow:none;border-radius:0;padding:8px 8px 24px}
.sheet{padding:16px 24px}

@media (max-width:1100px){#app{grid-template-columns:220px minmax(300px,380px) 1fr}.brand{width:200px}}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:72px 1fr}
  .top{padding:10px 12px 6px}
  .brand{display:none}
  .search{max-width:none;height:52px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .search .menu{display:inline-grid}
  .search .glass{display:none}
  .search input{font-size:17px}
  .me-btn{width:34px;height:34px;margin-right:4px}
  .list{background:var(--paper);border-radius:0}
  .listhead{background:var(--paper);border:0;padding:10px 20px 8px}
  .msgs{padding:0 10px 96px}
  .msgs li{background:var(--card);border:0;border-radius:18px;margin-bottom:4px;overflow:hidden}
  .msgs .row{padding:14px 16px}
  .read{border:0}
  #app.railopen .rail{inset:0 auto 0 0;width:min(300px,85vw);padding-top:16px;background:var(--card);border-radius:0 18px 18px 0;box-shadow:0 8px 40px rgba(0,0,0,.25);z-index:20}
  #app.railopen::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .fab{position:fixed;right:16px;bottom:22px;z-index:10;border-radius:18px!important;padding:16px 22px 16px 18px!important;box-shadow:0 3px 10px rgba(0,0,0,.2);margin:0;transition:padding .2s ease}
  .fab.small{padding:16px!important}
  .fab.small span{display:none}
  .menu-pop{top:66px;right:10px;left:10px;min-width:0}
  .sheet{padding:8px 12px}
}
@media (min-width:821px){#app .fab{display:none!important}}
@media (prefers-reduced-motion:reduce){.fab{transition:none}}
.msgs .star{position:absolute;width:36px;height:36px;padding:0;display:grid;right:8px;bottom:6px}
.msgs .unread .star::before,.msgs .star::before{content:none}
.from .avatar{width:40px;height:40px;font-size:17px}
@media (max-width:820px){dialog#write{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0}dialog#write .wform{height:100%;max-height:100vh}dialog#write textarea{min-height:0}}
</style>
</head>
<body>

<!-- ======================= sign in ======================= -->
<main id="signin" hidden>
  <div class="door">
    <svg class="postmark" viewBox="0 0 220 220" aria-hidden="true">
      <defs><path id="ring" d="M110,110 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
      <circle cx="110" cy="110" r="96" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="110" cy="110" r="64" fill="none" stroke="currentColor" stroke-width="2"/>
      <text font-size="15" font-weight="700" fill="currentColor"><textPath href="#ring" startOffset="0" textLength="482" lengthAdjust="spacing">CHAUSIMA MAIL · CHAUSIMA.COM · SIGN IN ·</textPath></text>
      <text id="pmDate" x="110" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"></text>
      <text id="pmTime" x="110" y="128" text-anchor="middle" font-size="16" fill="currentColor"></text>
      <g class="waves" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
        <path class="wave" d="M-20 88 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" />
        <path class="wave" d="M-20 132 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" />
      </g>
    </svg>
    <h1>Sign in to your mail</h1>
    <p class="lead">For people with a chausima.com address.</p>
    <form id="signinForm" novalidate>
      <div class="field"><label for="em">Email address</label><input id="em" type="email" autocomplete="username" inputmode="email" placeholder="you@chausima.com" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <label class="check"><input id="stay" type="checkbox" checked> Keep me signed in on this tab</label>
      <button class="btn main" id="goBtn" type="submit">Sign in</button>

<script>
/* Brand intro: a short line-drawing animation shown once per visit before a sign-in page.

(function () {
  "use strict";

  const SCENES = {
    chausima: {
      bg: "#ffffff", ink: "#9aa3ad", main: "#c8312b", on: "#ffffff", word: "CHAUSIMA", sub: "MAIL", size: 150,
      font: "'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif",

          <path class="ln wv" d="M-1500 400 q40 -26 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
          <path class="ln wv" d="M-1500 440 q40 -26 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
        </g>`,
      fly: [{ transform: "translate(500px,270px)" }, { transform: "translate(2300px,-200px) rotate(14deg) scale(.45)" }]
    },
    site: {
      bg: "#fdfdf8", ink: "#9aa3ad", main: "#1f3a93", on: "#ffffff", word: "CHAUSIMA", sub: "BY HWL SYSTEMS", size: 150,
      font: "'Bricolage Grotesque', 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif",
      art: `
        <g class="sk" id="bi-subject" transform="translate(500 290)">
          <path class="ln" d="M0 -110 C-60 -130 -140 -125 -190 -100 L-190 120 C-140 95 -60 90 0 110 Z"/>
          <path class="ln" d="M0 -110 C60 -130 140 -125 190 -100 L190 120 C140 95 60 90 0 110 Z"/>
          <path class="ln" d="M0 -110 L0 110"/>
          <path class="ln" d="M-160 -60 L-40 -54 M-160 -20 L-40 -14 M-160 20 L-70 25"/>
          <path class="ln" d="M40 -54 L160 -60 M40 -14 L160 -20 M40 26 L120 22"/>
          <path class="ln" d="M150 -150 L210 -210 L226 -194 L166 -134 Z M150 -150 L142 -126 L166 -134"/>
        </g>
        <g id="bi-waves" class="sk"><path class="ln wv" d="M-1500 420 L2500 420"/><path class="ln wv" d="M-1500 446 L2500 446"/></g>`,
      fly: [{ transform: "translate(500px,290px)" }, { transform: "translate(500px,1200px) rotate(-8deg) scale(.6)" }]
    },
    hwl: {
      bg: "#ffffff", ink: "#9aa3ad", main: "#1f4fd8", on: "#ffffff", word: "HWL", sub: "LAUNCHPAD", size: 200,
      font: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif",
      art: `
        <g class="sk" id="bi-subject" transform="translate(500 300)">
          <path class="ln" d="M0 -170 C48 -120 58 -40 52 40 L-52 40 C-58 -40 -48 -120 0 -170 Z"/>
          <circle cy="-70" r="22" class="ln"/>
          <path class="ln" d="M-52 0 L-96 62 L-52 46 M52 0 L96 62 L52 46"/>
          <path class="ln" d="M-24 40 L-30 70 L30 70 L24 40"/>
        </g>
        <g id="bi-waves" class="sk"><path class="ln wv" d="M200 376 L800 376"/><path class="ln wv" d="M260 396 L740 396"/></g>
        <g id="bi-smoke"></g>`,
      fly: [{ transform: "translate(500px,300px)" }, { transform: "translate(500px,-1200px) scale(.7)" }]
    }
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function play(name, opts) {
    opts = opts || {};
    const sc = SCENES[name];
    let seen = false;
    try { seen = sessionStorage.getItem("bi.seen." + name) === "1"; } catch (e) {}
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!sc || seen || reduce || !Element.prototype.animate) { if (opts.onDone) opts.onDone(); return; }
    try { sessionStorage.setItem("bi.seen." + name, "1"); } catch (e) {}

    const box = document.createElement("div");
    box.setAttribute("role", "presentation");
    box.style.cssText = `position:fixed;inset:0;z-index:2147483000;background:${sc.bg};overflow:hidden;cursor:pointer`;
    const vw = Math.max(560, Math.min(1000, 600 * innerWidth / innerHeight));
    box.innerHTML = `<svg xmlns="${NS}" viewBox="${500 - vw / 2} 0 ${vw} 600" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block" aria-hidden="true">
      <style>
        .ln{fill:none;stroke:${sc.ink};stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
        .wv{stroke-width:7}
        .big{font:900 ${sc.size}px ${sc.font};letter-spacing:4px;fill:transparent;stroke:${sc.on};stroke-width:3;stroke-dasharray:2400;stroke-dashoffset:2400}
        .small{font:700 34px ${sc.font};letter-spacing:22px;fill:${sc.on};opacity:0}
      </style>
      <rect id="bi-flood" x="-2500" y="-1500" width="6000" height="3600" fill="${sc.main}" style="transform-origin:-2500px 50%;transform:scaleX(0)"/>
      ${sc.art}
      <text id="bi-word" class="big" x="500" y="330" text-anchor="middle">${sc.word}</text>
      <text id="bi-sub" class="small" x="511" y="400" text-anchor="middle">${sc.sub}</text>
    </svg>
    <button type="button" style="position:absolute;right:18px;bottom:18px;border:0;border-radius:999px;padding:9px 16px;font:600 14px system-ui,sans-serif;background:rgba(0,0,0,.08);color:#333;cursor:pointer">Skip</button>`;
    document.body.appendChild(box);
    const $ = (id) => box.querySelector("#" + id);
    const lines = [...box.querySelectorAll(".ln")];
    lines.forEach((p) => { const L = p.getTotalLength ? Math.ceil(p.getTotalLength()) : 1500; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L; });
    const anims = [];
    const go = (el, kf, o) => { const a = el.animate(kf, Object.assign({ fill: "forwards", easing: "cubic-bezier(.45,.05,.2,1)" }, o)); anims.push(a); return a.finished.catch(() => {}); };
    let done = false;
    async function finish(fast) {
      if (done) return; done = true;
      anims.forEach((a) => { try { a.finish(); } catch (e) {} });
      await go(box, [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.06)" }], { duration: fast ? 220 : 650, easing: "ease-in" });
      box.remove();
      if (opts.onDone) opts.onDone();
    }
    box.addEventListener("click", () => finish(true));
    const key = () => { document.removeEventListener("keydown", key); finish(true); };
    document.addEventListener("keydown", key);

    (async () => {
      const subject = $("bi-subject"), waves = box.querySelectorAll("#bi-waves .ln"), subjLines = subject.querySelectorAll(".ln");
      // 1. the pencil sketch draws itself
      subjLines.forEach((p, i) => go(p, [{ strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0 }], { duration: 1000, delay: i * 120 }));
      await wait(1250); if (done) return;
      // 2. colour floods across, the sketch turns to ink on colour
      go($("bi-flood"), [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 600, easing: "cubic-bezier(.7,0,.2,1)" });
      await wait(260);
      lines.forEach((p) => go(p, [{ stroke: sc.ink }, { stroke: sc.on }], { duration: 300 }));
      await wait(500); if (done) return;
      // 3. the subject flies off, leaving its trail
      waves.forEach((p, i) => go(p, [{ strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0 }], { duration: 750, delay: i * 90 }));
      if (name === "hwl") {
        const smoke = $("bi-smoke");
        for (let i = 0; i < 14; i++) {
          const c = document.createElementNS(NS, "circle");
          const x = 500 + (Math.random() - .5) * 220, y = 390 + Math.random() * 40;
          c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 30 + Math.random() * 40);
          c.setAttribute("fill", "#ffffff"); c.style.opacity = 0; c.style.transformOrigin = `${x}px ${y}px`;
          smoke.appendChild(c);
          go(c, [{ opacity: 0, transform: "scale(.2)" }, { opacity: .95, transform: "scale(1)", offset: .35 }, { opacity: 0, transform: "scale(2.4) translateY(30px)" }], { duration: 1500, delay: 80 + i * 45, easing: "ease-out" });
        }
      }
      await go(subject, sc.fly, { duration: 900, easing: "cubic-bezier(.6,0,.4,1)" });
      if (done) return;
      go(box.querySelector("#bi-waves"), [{ opacity: 1 }, { opacity: .25 }], { duration: 400 });
      // 4. the name draws stroke by stroke, then fills
      const word = $("bi-word"), sub = $("bi-sub");
      try { await Promise.race([document.fonts.ready, wait(400)]); } catch (e) {}
      const fit = (el, base) => { const w = el.getComputedTextLength(), max = vw * 0.86; if (w > max) el.style.fontSize = (base * max / w) + "px"; };
      fit(word, sc.size);
      if (sub.getComputedTextLength() > vw * 0.86) { sub.style.letterSpacing = "8px"; fit(sub, 34); }
      await go(word, [{ strokeDashoffset: 2400 }, { strokeDashoffset: 0 }], { duration: 1300, easing: "ease-in-out" });
      if (done) return;
      go(word, [{ fill: "rgba(255,255,255,0)" }, { fill: sc.on }], { duration: 380 });
      const ls = parseFloat(sub.style.letterSpacing) || 22;
      await go(sub, [{ opacity: 0, letterSpacing: (ls + 18) + "px" }, { opacity: 1, letterSpacing: ls + "px" }], { duration: 500, easing: "ease-out" });
      await wait(550);
      // 5. reveal the page
      finish(false);
    })();
  }
  window.BrandIntro = { play };
})();

</script>
<script>
"use strict";
/* Chausima Mail: a small webmail that talks JMAP (RFC 8620/8621) to Stalwart on the same address.
   The password never leaves this page except to the mail server itself. */
const USING = ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail", "urn:ietf:params:jmap:submission"];
const PAGE = 40;
const $ = (id) => document.getElementById(id);
const S = { auth: "", email: "", api: "", dl: "", acct: "", boxes: [], box: null, ids: [], pos: 0, total: 0, q: "", open: null, ident: null, showImgs: false, timer: 0, reply: null };

/* ---------- small helpers ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };
const pref = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3200); }
function who(a) { return a && a.length ? (a[0].name || a[0].email) : "(nobody)"; }
function addrs(a) { return (a || []).map((x) => x.name ? `${x.name} <${x.email}>` : x.email).join(", "); }
function when(iso, long) {
  const d = new Date(iso), now = new Date();
  if (long) return d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  if (now - d < 6 * 864e5) return d.toLocaleDateString("en-GB", { weekday: "short" });
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", ...(d.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) });
}
function parseList(s) {
  return String(s || "").split(/[,;\n]/).map((x) => x.trim()).filter(Boolean).map((x) => {
    const m = x.match(/^(.*)<([^>]+)>$/); const email = (m ? m[2] : x).trim(); const name = m ? m[1].trim().replace(/^"|"$/g, "") : "";
    return name ? { name, email } : { email };
  });
}
const okEmail = (e) => /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(e);
const AV = ["#c8312b", "#2f6f8f", "#6b5b95", "#2e7d5b", "#b5651d", "#8e3b6e", "#3d5a99", "#7a6a2a"];
function avatar(a, big) {
  const x = (a && a[0]) || {}, label = (x.name || x.email || "?").trim(), ch = (label.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase();
  let h = 0; for (const c of (x.email || label).toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="avatar${big ? " big" : ""}" style="background:${AV[h % AV.length]}" aria-hidden="true">${esc(ch)}</span>`;
}
function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }

/* ---------- talking to the server ---------- */
class MailError extends Error {}
async function req(url, opts = {}) {
  let r;
  try { r = await fetch(url, { ...opts, headers: { Authorization: S.auth, ...(opts.headers || {}) } }); }
  catch { throw new MailError("Can't reach the mail server. Check your internet and try again."); }
  if (r.status === 401) throw new MailError("AUTH");
  if (!r.ok) throw new MailError(`The mail server said no (error ${r.status}). Try again in a minute.`);
  return r;
}
const same = (u) => { try { const x = new URL(u, location.href); return x.pathname + x.search; } catch { return u; } };
async function jmap(calls) {
  const r = await req(S.api, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ using: USING, methodCalls: calls }) });
  const d = await r.json();
  for (const [name, res] of d.methodResponses) if (name === "error") throw new MailError(res.description || `The mail server couldn't do that (${res.type}).`);
  return d.methodResponses;
}
const pick = (res, tag) => (res.find((x) => x[2] === tag) || [])[1] || {};

async function connect(email, password) {
  S.auth = "Basic " + btoa(unescape(encodeURIComponent(email + ":" + password)));
  const r = await req("/jmap/session", { headers: { accept: "application/json" } });
  const s = await r.json();
  if (!s.username) throw new MailError("AUTH");
  S.email = s.username;
  S.api = same(s.apiUrl);
  S.dl = s.downloadUrl;
  S.acct = s.primaryAccounts["urn:ietf:params:jmap:mail"];
  if (!S.acct) throw new MailError("This account doesn't have a mailbox yet.");
}

/* ---------- sign in / out ---------- */
function showSignin(msg) {
  if (window.BrandIntro) BrandIntro.play("chausima");
  $("app").hidden = true; $("signin").hidden = false; $("signErr").textContent = msg || "";
  const now = new Date();
  $("pmDate").textContent = now.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }).toUpperCase();
  $("pmTime").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  setWaves(false);
  setTimeout(() => $("em").focus(), 50);
}
function setWaves(go) {
  document.querySelectorAll(".postmark .wave").forEach((w) => { const L = 280; w.style.strokeDasharray = L; w.style.strokeDashoffset = go ? 0 : L; });
}
$("signinForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("em").value.trim().toLowerCase(), pw = $("pw").value;
  if (!okEmail(email)) { $("signErr").textContent = "Type your full email address, like you@chausima.com."; $("em").focus(); return; }
  if (!pw) { $("signErr").textContent = "Type your password."; $("pw").focus(); return; }
  $("goBtn").disabled = true; $("goBtn").textContent = "Signing in…"; $("signErr").textContent = "";
  try {
    await connect(email, pw);
    if ($("stay").checked) store.set("cm.a", S.auth + "\n" + email); else store.del("cm.a");
    $("pw").value = "";
    setWaves(true);
    await new Promise((r) => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 650));
    await start();
  } catch (err) {
    $("signErr").textContent = err.message === "AUTH" ? "That email or password didn't work." : err.message;
    S.auth = "";
  } finally { $("goBtn").disabled = false; $("goBtn").textContent = "Sign in"; }
});
function signOut(msg) {
  clearInterval(S.timer); store.del("cm.a"); Object.assign(S, { auth: "", boxes: [], box: null, ids: [], open: null, ident: null });
  $("msgs").innerHTML = ""; $("sheet").hidden = true; $("nothing").hidden = false;
  showSignin(msg);
}
$("outBtn").onclick = () => signOut("You've signed out.");
function fail(err) {
  if (err && err.message === "AUTH") return signOut("Please sign in again.");
  toast(err && err.message ? err.message : "Something went wrong. Try again.");
}

/* ---------- folders ---------- */
const ROLE_ORDER = ["inbox", "drafts", "sent", "archive", "junk", "trash"];
const ROLE_NAME = { inbox: "Inbox", drafts: "Drafts", sent: "Sent", archive: "Archive", junk: "Junk", trash: "Bin" };
const ICON = {
  inbox: '<path d="M4 13l2.5-7h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>',

  $("meBig").outerHTML = avatar(me, true).replace('class="avatar big"', 'class="avatar big" id="meBig"');
  $("meBtn").onclick = () => { const h = !$("mePop").hidden; $("mePop").hidden = h; $("meBtn").setAttribute("aria-expanded", String(!h)); };
  themeLabel();
  await loadBoxes();
  S.box = role("inbox") || S.boxes[0];
  drawBoxes(); await loadList();
  clearInterval(S.timer); S.timer = setInterval(() => { if (!document.hidden && !$("write").open) refresh(false); }, 60000);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async () => {
  const saved = store.get("cm.a");
  if (saved) {
    const [auth, email] = saved.split("\n"); S.auth = auth;
    try {
      const r = await req("/jmap/session"); const s = await r.json();
      if (!s.username) throw new MailError("AUTH");
      S.email = s.username || email; S.api = same(s.apiUrl); S.dl = s.downloadUrl; S.acct = s.primaryAccounts["urn:ietf:params:jmap:mail"];
      return await start();
    } catch { store.del("cm.a"); S.auth = ""; }
  }
  showSignin();
})();
